async function api(action, body=null) {
  try {
    const opts = body
      ? {method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)}
      : {method:'GET'};
    const url = action ? API_URL+'?action='+action : API_URL;
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 15000);
    const res = await fetch(url, {...opts, signal: controller.signal});
    clearTimeout(timer);
    const text = await res.text();
    try { return JSON.parse(text); } catch { return {error:'Respuesta inválida: '+text.slice(0,100)}; }
  } catch(e) { return {error:e.message}; }
}

const fmt = n => '$' + Math.round(n||0).toLocaleString('es-CL');
const localDate = () => new Date().toLocaleDateString('sv-SE',{timeZone:'America/Santiago'});
const localTime = () => new Date().toLocaleTimeString('es-CL',{timeZone:'America/Santiago',hour:'2-digit',minute:'2-digit'});
// Extrae la fecha local (YYYY-MM-DD) de una venta, priorizando el campo date (ya localizado)
// sobre datetime (UTC), para evitar desfases de zona horaria nocturna.
const getSaleDate = s => {
  if(s.date && /^\d{4}-\d{2}-\d{2}/.test(String(s.date))) return String(s.date).substring(0,10);
  const raw = String(s.datetime||s.date||'');
  if(raw.includes('T')&&raw.includes('Z')) return new Date(raw).toLocaleDateString('sv-SE',{timeZone:'America/Santiago'});
  return raw.substring(0,10);
};

const storage = {
  getCierres: () => { try { return JSON.parse(localStorage.getItem('panksero_cierres')||'[]'); } catch { return []; } },
  saveCierres: (data) => localStorage.setItem('panksero_cierres', JSON.stringify(data)),
  getMovimientos: () => { try { return JSON.parse(localStorage.getItem('panksero_movimientos')||'[]'); } catch { return []; } },
  addMovimiento: (mov) => {
    const arr = storage.getMovimientos();
    arr.unshift(mov);
    if(arr.length > 500) arr.splice(500);
    localStorage.setItem('panksero_movimientos', JSON.stringify(arr));
  },
  getProducts: () => { try { return JSON.parse(localStorage.getItem('panksero_products')||'null'); } catch { return null; } },
  saveProducts: (data) => localStorage.setItem('panksero_products', JSON.stringify(data)),
  getSales: () => { try { return JSON.parse(localStorage.getItem('panksero_sales')||'[]'); } catch { return []; } },
  saveSales: (data) => localStorage.setItem('panksero_sales', JSON.stringify(data)),
  getCredits: () => { try { return JSON.parse(localStorage.getItem('panksero_credits')||'[]'); } catch { return []; } },

};

// ── Generador de cierre HTML descargable ──
function generarHtmlCierre(cierre) {
  const metodos = Object.entries(cierre.byMethod).filter(([,v])=>v>0);
  const productos = cierre.topProductos||[];
  const stockCrit = cierre.stockCritico||[];
  return `<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"/>
<title>Cierre ${cierre.fecha}</title>
<style>
body{font-family:Arial,sans-serif;max-width:380px;margin:0 auto;padding:16px;color:#222}
h1{text-align:center;font-size:1.3em;margin-bottom:2px}
.sub{text-align:center;color:#666;font-size:.85em;margin-bottom:14px}
h3{border-bottom:2px solid #333;padding-bottom:3px;margin:12px 0 6px;font-size:.9em;text-transform:uppercase}
.row{display:flex;justify-content:space-between;padding:4px 2px;border-bottom:1px solid #eee;font-size:.85em}
.total-row{display:flex;justify-content:space-between;padding:8px 2px;font-size:1.2em;font-weight:bold;border-top:2px solid #333;margin-top:4px}
.warn{color:#c0392b;font-weight:bold}
.footer{text-align:center;margin-top:20px;font-size:.72em;color:#999}
@media print{body{padding:4px}}
</style></head><body>
<h1>🥖 Panksero POS</h1>
<div class="sub">Cierre del día ${cierre.fecha} · ${cierre.hora}</div>

<h3>Resumen General</h3>
<div class="row"><span>Transacciones</span><span>${cierre.ventas}</span></div>
<div class="row"><span>Ticket promedio</span><span>${cierre.ventas>0?fmt(Math.round(cierre.total/cierre.ventas)):'-'}</span></div>
<div class="total-row"><span>TOTAL DEL DÍA</span><span>${fmt(cierre.total)}</span></div>

<h3>Por Método de Pago</h3>
${metodos.map(([m,v])=>`<div class="row"><span>${m==='Efectivo'?'💵':m==='Getnet'?'💳':m==='Transferencia'?'📲':'📝'} ${m}</span><span>${fmt(v)} ${cierre.total>0?'('+Math.round(v/cierre.total*100)+'%)':''}</span></div>`).join('')}
${metodos.length===0?'<div class="row"><span colspan="2" style="color:#999">Sin ventas</span></div>':''}

<h3>Top Productos</h3>
${productos.slice(0,10).map(([name,d],i)=>`<div class="row"><span>${i+1}. ${name}</span><span>${d.qty} uds · ${fmt(d.total)}</span></div>`).join('')}
${productos.length===0?'<div class="row"><span style="color:#999">Sin productos vendidos</span></div>':''}

<h3>Créditos Pendientes</h3>
<div class="row"><span>Cantidad de cargos</span><span>${cierre.creditosPendientes}</span></div>
<div class="row"><span>Monto pendiente</span><span class="${cierre.totalCredPendiente>0?'warn':''}">${fmt(cierre.totalCredPendiente)}</span></div>

${stockCrit.length>0?`<h3>⚠️ Stock Crítico</h3>
${stockCrit.map(p=>`<div class="row"><span>${p.name}</span><span class="warn">${p.stock===0?'SIN STOCK':p.stock+' uds'}</span></div>`).join('')}`:''}

<div class="footer">Panksero POS · Generado ${new Date().toLocaleString('es-CL',{timeZone:'America/Santiago'})}</div>
<script>setTimeout(()=>window.print(),400);<\/script>
</body></html>`;
}

function exportarCierre(cierre) {
  const html = generarHtmlCierre(cierre);
  const blob = new Blob([html], {type:'text/html;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Cierre_${cierre.fecha}_${cierre.hora.replace(':','-')}.html`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
}

function App() {
  const [products, setProducts] = useState([]);
  const [sales, setSales] = useState([]);
  const [credits, setCredits] = useState([]);
  const [cierres, setCierres] = useState(()=>storage.getCierres());
  const [loading, setLoading] = useState(true);
  const [dbStatus, setDbStatus] = useState('connecting');
  const [tab, setTab] = useState('pos');
  const [cart, setCart] = useState([]);
  const [search, setSearch] = useState('');
  const [catFilter, setCatFilter] = useState('Todos');
  const [stockCat, setStockCat] = useState('Todos');
  const [stockSearch, setStockSearch] = useState('');
  const [payMethod, setPayMethod] = useState('Efectivo');
  const [clientName, setClientName] = useState('');
  const [cashInput, setCashInput] = useState('');
  const [barcodeInput, setBarcodeInput] = useState('');
  const [editP, setEditP] = useState(null);
  const [stockModal, setStockModal] = useState(null);
  const [creditModal, setCreditModal] = useState(null);
  const [cierreModal, setCierreModal] = useState(false);
  const [toast, setToast] = useState(null);
  const [reportDate, setReportDate] = useState(today);
  const [migrating, setMigrating] = useState(false);
  const [processing, setProcessing] = useState(false);
  const [migrationLog, setMigrationLog] = useState([]);
  const [offlineMode, setOfflineMode] = useState(false);
  const barcodeRef = useRef(null);

  const showToast = (msg, color='#2d6a4f') => { setToast({msg,color}); setTimeout(()=>setToast(null),3500); };

  const loadData = useCallback(async () => {
    setDbStatus('connecting');
    const [prods, sls, crds] = await Promise.all([
      api('getProducts'), api('getSales'), api('getCredits')
    ]);
    if(prods.error) {
      const cached = storage.getProducts();
      if(cached && cached.length > 0) {
        setProducts(cached);
        setSales(storage.getSales());
        setCredits(storage.getCredits());
        setOfflineMode(true);
        setDbStatus('ok');
        setLoading(false);
      } else if(MIGRATION_PRODUCTS && MIGRATION_PRODUCTS.length > 0) {
        setProducts(MIGRATION_PRODUCTS);
        setSales(MIGRATION_SALES || []);
        setCredits([]);
        setOfflineMode(true);
        setDbStatus('ok');
        setLoading(false);
      } else {
        setDbStatus('error');
        setLoading(false);
      }
      return;
    }
    setProducts(Array.isArray(prods)?prods:[]);
    setSales(Array.isArray(sls)?sls:[]);
    setCredits(Array.isArray(crds)?crds:[]);
    storage.saveProducts(Array.isArray(prods)?prods:[]);
    storage.saveSales(Array.isArray(sls)?sls:[]);
    storage.saveCredits(Array.isArray(crds)?crds:[]);
    setOfflineMode(false);
    setDbStatus('ok');
    setLoading(false);
  }, []);

  useEffect(()=>{ loadData(); },[loadData]);

  useEffect(()=>{
    if(tab!=='pos'||editP||stockModal||creditModal||cierreModal) return;
    const h=()=>setTimeout(()=>{ const t=document.activeElement?.tagName; if(t!=='INPUT'&&t!=='TEXTAREA'&&t!=='SELECT') barcodeRef.current?.focus(); },120);
    document.addEventListener('click',h);
    setTimeout(()=>barcodeRef.current?.focus(),200);
    return ()=>document.removeEventListener('click',h);
  },[tab,editP,stockModal,creditModal,cierreModal]);

  // ── Agregar al carrito con validación de stock ──
  const addToCart = p => {
    if(p.stock <= 0) { showToast('⚠️ Sin stock: '+p.name,'#c0392b'); return; }
    setCart(c=>{
      const ex = c.find(x=>x.id===p.id);
      if(ex) {
        const prod = products.find(x=>x.id===p.id);
        if(prod && ex.qty >= prod.stock) {
          showToast('⚠️ Máximo disponible: '+prod.stock+' unidades','#c9963a');
          return c;
        }
        return c.map(x=>x.id===p.id?{...x,qty:x.qty+1}:x);
      }
      return [...c,{...p,qty:1}];
    });
  };

  const cartTotal = cart.reduce((a,x)=>a+x.price*x.qty,0);

  // ── Procesar venta con validación completa ──
  const processSale = async () => {
    if(!cart.length) return;
    if(payMethod==='Crédito'&&!clientName.trim()){showToast('⚠️ Ingresa el nombre del cliente','#c9963a');return;}
    if(processing) return;

    // Validar stock antes de procesar
    for(const item of cart) {
      const prod = products.find(p=>p.id===item.id);
      if(prod && prod.stock < item.qty) {
        showToast('⚠️ Stock insuficiente: '+item.name+' (disponible: '+prod.stock+')','#c0392b');
        return;
      }
    }

    setProcessing(true);
    const snap = cart.map(x=>({...x}));
    const sale = {
      id: Date.now().toString()+Math.floor(Math.random()*1000).toString(),
      date: localDate(), datetime: new Date().toISOString(), time: localTime(),
      items: snap.map(x=>({id:x.id,name:x.name,category:x.category,price:x.price,qty:x.qty})),
      total: cartTotal, method: payMethod||'Efectivo', client: clientName||''
    };

    // Actualizar UI inmediatamente sin esperar la API
    const updatedProds = [...products];
    const stockUpdates = [];
    for(const it of snap){
      const idx = updatedProds.findIndex(p=>p.id===it.id);
      if(idx!==-1){
        const ns = Math.max(0, updatedProds[idx].stock - it.qty);
        storage.addMovimiento({fecha:localDate(),hora:localTime(),tipo:'venta',producto:updatedProds[idx].name,cantidad:-it.qty,stockAntes:updatedProds[idx].stock,stockDespues:ns,ref:sale.id});
        stockUpdates.push({id:it.id,stock:ns});
        updatedProds[idx] = {...updatedProds[idx],stock:ns};
      }
    }
    setProducts(updatedProds);
    storage.saveProducts(updatedProds);
    setSales(s=>[sale,...s]);
    setCart([]); setCashInput(''); setClientName('');
    setProcessing(false);
    showToast('✅ '+(payMethod==='Crédito'?'Crédito':'Venta')+' '+fmt(cartTotal)+' registrado');
    setTimeout(()=>barcodeRef.current?.focus(),150);

    // Enviar todo a Google Sheets en paralelo en background
    const apiCalls = [api(null,{action:'saveSale',sale})];
    if(payMethod==='Crédito'){
      const credEntry = {id:sale.id,date:localDate(),time:localTime(),client:clientName,total:cartTotal,paid:false,items:sale.items,nota:''};
      setCredits(c=>[credEntry,...c]);
      apiCalls.push(api(null,{action:'saveCredit',credit:credEntry}));
    }
    stockUpdates.forEach(u=>apiCalls.push(api(null,{action:'updateStock',id:u.id,stock:u.stock})));
    Promise.all(apiCalls).then(results=>{
      if(results[0]?.error) showToast('⚠️ Venta guardada localmente (sin conexión)','#c9963a');
    });
  };

  const pagarCredito = async (id) => {
    const r = await api(null,{action:'payCredit',id});
    if(r.error){ showToast('⚠️ Error al cobrar','#c0392b'); return; }
    const td = localDate();
    setCredits(c=>c.map(x=>x.id===id?{...x,paid:true,paid_date:td}:x));
    showToast('✅ Crédito cobrado');
  };

  const saveProduct = async (ep) => {
    if(!ep.name?.trim()){showToast('⚠️ Nombre obligatorio','#c9963a');return;}
    if(!(ep.price>0)){showToast('⚠️ Precio obligatorio','#c9963a');return;}
    if(processing) return;
    setProcessing(true);
    showToast('⏳ Guardando...','#c9963a');
    const autoId = 'P'+Date.now().toString().slice(-8);
    const clean={id:String(ep.id||'').trim()||autoId,name:String(ep.name).trim(),category:String(ep.category||'Panadería'),price:Math.abs(parseInt(ep.price)||0),cost:Math.abs(parseInt(ep.cost)||0),stock:Math.abs(parseInt(ep.stock)||0),unit:String(ep.unit||'un')};
    const r = await api(null,{action:'saveProduct',product:clean});
    setProcessing(false);
    if(r.error){showToast('⚠️ '+r.error,'#c0392b');return;}
    if(ep._new) setProducts(ps=>[...ps,clean]);
    else setProducts(ps=>ps.map(p=>p.id===clean.id?clean:p));
    showToast('✅ "'+clean.name+'" '+(ep._new?'agregado':'guardado'));
    setEditP(null);
  };

  const deleteProduct = async (p) => {
    if(!window.confirm('¿Eliminar "'+p.name+'"?')) return;
    if(processing) return;
    setProcessing(true);
    const r = await api(null,{action:'deleteProduct',id:p.id});
    setProcessing(false);
    if(r.error){showToast('⚠️ '+r.error,'#c0392b');return;}
    setProducts(ps=>ps.filter(x=>x.id!==p.id));
    showToast('🗑️ "'+p.name+'" eliminado','#c0392b');
    setEditP(null);
  };

  const runMigration = async () => {
    setMigrating(true);
    const log=['🔄 Iniciando migración...'];
    setMigrationLog([...log]);
    const r = await api(null,{action:'migrate',products:MIGRATION_PRODUCTS,sales:MIGRATION_SALES,credits:MIGRATION_CREDITS});
    if(r.error){ setMigrationLog([...log,'❌ '+r.error]); setMigrating(false); return; }
    r.log?.forEach(l=>log.push(l));
    log.push('✅ Listo. Recargando...');
    setMigrationLog([...log]);
    setTimeout(()=>{setMigrating(false);setMigrationLog([]);loadData();},2000);
  };

  // ── Cierre de Caja ──
  const normMethod = m => {
    const v=(m||'').toLowerCase();
    if(v==='efectivo'||v==='cash') return 'Efectivo';
    if(v==='getnet'||v==='tarjeta'||v==='débito'||v==='debito') return 'Getnet';
    if(v==='transferencia'||v==='transfer') return 'Transferencia';
    if(v==='crédito'||v==='credito'||v==='credit') return 'Crédito';
    return 'Efectivo';
  };

  const realizarCierre = () => {
    const todaySales = sales.filter(s=>getSaleDate(s)===localDate());
    const total = todaySales.reduce((a,s)=>a+s.total,0);
    const byMethod = {'Efectivo':0,'Getnet':0,'Transferencia':0,'Crédito':0};
    todaySales.forEach(s=>{ const nm=normMethod(s.method||s.payment); if(byMethod[nm]!==undefined) byMethod[nm]+=s.total; });
    const byProd = {};
    todaySales.forEach(s=>s.items?.forEach(it=>{
      if(!byProd[it.name]) byProd[it.name]={qty:0,total:0};
      byProd[it.name].qty+=it.qty; byProd[it.name].total+=it.price*it.qty;
    }));
    const pendCred = credits.filter(c=>!c.paid);
    const cierre = {
      id: Date.now().toString(),
      fecha: localDate(),
      hora: localTime(),
      ventas: todaySales.length,
      total,
      byMethod,
      topProductos: Object.entries(byProd).sort((a,b)=>b[1].total-a[1].total),
      creditosPendientes: pendCred.length,
      totalCredPendiente: pendCred.reduce((a,c)=>a+c.total,0),
      stockCritico: products.filter(p=>p.stock<=3).map(p=>({id:p.id,name:p.name,stock:p.stock}))
    };
    const nuevos = [cierre,...cierres];
    setCierres(nuevos);
    storage.saveCierres(nuevos);
    exportarCierre(cierre);
    setCierreModal(false);
    showToast('✅ Cierre guardado y descargado');
  };

  // ── Datos calculados ──
  const rSales=sales.filter(s=>getSaleDate(s)===reportDate);
  const rTotal=rSales.reduce((a,s)=>a+s.total,0);
  const rByM={'Efectivo':0,'Getnet':0,'Transferencia':0,'Crédito':0};
  rSales.forEach(s=>{const nm=normMethod(s.method||s.payment);if(rByM[nm]!==undefined)rByM[nm]+=s.total;});

  const pendCredits=credits.filter(c=>!c.paid);
  const cats=['Todos',...[...new Set(products.map(p=>p.category))]];
  const filtered=products.filter(p=>{
    const mc=catFilter==='Todos'||p.category===catFilter;
    const ms=!search||p.name.toLowerCase().includes(search.toLowerCase())||String(p.id).includes(search);
    return mc&&ms;
  });
  const stockCriticos = products.filter(p=>p.stock<=3);
  const CAT_ICONS={'Panadería':'🍞','Bollería':'🥐','Pastelería':'🎂','Café':'☕','Café de Máquina':'☕','Nevera':'🧊','Bebidas':'🥤','Charcutería':'🥩','Abarrotes':'🛒','Congelado':'❄️'};

  if(loading||dbStatus==='connecting') return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#f5ede0',flexDirection:'column',gap:16}}>
      <div style={{fontFamily:"'Fraunces',serif",fontSize:'2.5rem',color:'#8B5E3C'}}>🥖</div>
      <div style={{fontFamily:"'Fraunces',serif",fontSize:'1.3rem',color:'#3d2010'}}>Panksero POS</div>
      <div style={{fontSize:'.9rem',color:'#c9963a',fontWeight:600}}>Conectando con Google Sheets...</div>
      <div style={{width:36,height:36,border:'4px solid #e8d5b7',borderTop:'4px solid #c9963a',borderRadius:'50%',animation:'spin 1s linear infinite'}}/>
    </div>
  );

  if(dbStatus==='error') return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#f5ede0',padding:20}}>
      <div style={{...S.card,maxWidth:440,width:'100%',padding:24,textAlign:'center'}}>
        <div style={{fontSize:'2rem',marginBottom:8}}>⚠️</div>
        <div style={{fontWeight:700,color:'#c0392b',marginBottom:8}}>Error de conexión</div>
        <div style={{fontSize:'.85rem',color:'#8B5E3C',marginBottom:16}}>No se conectó con Google Sheets. Verifica que el Apps Script esté desplegado correctamente.</div>
        <button onClick={()=>{setLoading(true);loadData();}} style={{...S.btn('#c9963a'),width:'100%',padding:12}}>🔄 Reintentar</button>
      </div>
    </div>
  );

  if(migrating) return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#f5ede0',padding:20}}>
      <div style={{...S.card,maxWidth:480,width:'100%',padding:24}}>
        <div style={{fontFamily:"'Fraunces',serif",fontSize:'1.2rem',color:'#3d2010',marginBottom:14}}>🔄 Migrando datos...</div>
        <div style={{background:'#f5ede0',borderRadius:8,padding:12,maxHeight:320,overflowY:'auto',fontFamily:'monospace',fontSize:'.78rem'}}>
          {migrationLog.map((l,i)=><div key={i} style={{color:l.includes('❌')?'#c0392b':l.includes('✅')?'#2d6a4f':'#c9963a',marginBottom:2}}>{l}</div>)}
        </div>
      </div>
    </div>
  );

  return (
    <div style={{minHeight:'100vh',background:'#f5ede0'}}>
      {/* ── Header ── */}
      <div style={{background:'#3d2010',padding:'10px 16px',display:'flex',alignItems:'center',justifyContent:'space-between',position:'sticky',top:0,zIndex:100,boxShadow:'0 2px 12px rgba(0,0,0,.3)'}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div style={{background:'#c9963a',borderRadius:8,width:32,height:32,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:"'Fraunces',serif",fontWeight:900,color:'#3d2010'}}>P</div>
          <div>
            <div style={{fontFamily:"'Fraunces',serif",color:'#f5ede0',fontWeight:700,fontSize:'.95rem',lineHeight:1}}>Panksero POS</div>
            <div style={{fontSize:'.62rem',color:'#c9963a'}}>{offlineMode?'📴 Sin conexión · ':' ☁️ Google Sheets · '}{products.length} productos{offlineMode&&<span style={{color:'#ff9966'}}> · datos locales</span>}{stockCriticos.length>0&&<span style={{color:'#ff9966'}}> · ⚠️ {stockCriticos.filter(p=>p.stock===0).length} sin stock</span>}</div>
          </div>
        </div>
        <div style={{display:'flex',gap:4,flexWrap:'wrap',justifyContent:'center'}}>
          {[['pos','🧾 Caja'],['stock','📦 Stock'],['report','📊 Reporte'],['creditos','📒 Créditos'],['config','⚙️']].map(([t,l])=>(
            <button key={t} onClick={()=>setTab(t)} style={{...S.btn(tab===t?'#c9963a':'transparent',tab===t?'#3d2010':'#c9963a'),padding:'6px 11px',fontSize:'.75rem',position:'relative'}}>
              {l}{t==='creditos'&&pendCredits.length>0&&<span style={{background:'#c0392b',color:'#fff',borderRadius:'50%',fontSize:'.6rem',padding:'0 4px',marginLeft:3}}>{pendCredits.length}</span>}
            </button>
          ))}
        </div>
        <div style={{color:'#8B5E3C',fontSize:'.75rem',textAlign:'right'}}><div id="clk">--:--</div><div id="hdr-date">{today}</div></div>
      </div>

      {toast&&<div style={{position:'fixed',bottom:24,left:'50%',transform:'translateX(-50%)',background:toast.color,color:'#fff',padding:'10px 22px',borderRadius:10,fontWeight:600,zIndex:9999,boxShadow:'0 4px 20px rgba(0,0,0,.2)',whiteSpace:'nowrap'}}>{toast.msg}</div>}

      {/* ── POS / Caja ── */}
      {tab==='pos'&&(
        <div style={{display:'grid',gridTemplateColumns:'1fr 300px',minHeight:'calc(100vh - 54px)'}}>
          <div style={{display:'flex',flexDirection:'column',overflow:'hidden'}}>
            <div style={{padding:'9px 12px',background:'#fff9f2',borderBottom:'1px solid #e8d5b7',display:'flex',gap:8}}>
              <input ref={barcodeRef} autoFocus value={barcodeInput} onChange={e=>setBarcodeInput(e.target.value)}
                onBlur={()=>{if(!editP&&!stockModal&&!creditModal&&!cierreModal&&tab==='pos')setTimeout(()=>{const t=document.activeElement?.tagName;if(t!=='INPUT'&&t!=='TEXTAREA'&&t!=='SELECT')barcodeRef.current?.focus();},100);}}
                onKeyDown={e=>{if(e.key==='Enter'&&barcodeInput.trim()){const q=barcodeInput.trim();const found=products.find(p=>String(p.id).trim()===q);if(found){addToCart(found);showToast('✅ '+found.name);}else showToast('⚠️ "'+q+'" no encontrado','#c9963a');setBarcodeInput('');setTimeout(()=>barcodeRef.current?.focus(),80);}}}
                placeholder="📷 Escanear código..." style={{flex:1,padding:'8px 14px',border:'2px solid #c9963a',borderRadius:10,fontSize:'.9rem',background:'#fef3c7'}}/>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Buscar..."
                style={{flex:2,padding:'8px 14px',border:'1.5px solid #e8d5b7',borderRadius:10,fontSize:'.9rem',background:'#fff9f2'}}/>
            </div>

            {/* Resumen del día */}
            {(()=>{const ts=sales.filter(s=>getSaleDate(s)===localDate());const tt=ts.reduce((a,s)=>a+s.total,0);return(
              <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:6,padding:'7px 12px',background:'#fff9f2',borderBottom:'1px solid #e8d5b7'}}>
                {[['Ventas hoy',fmt(tt)],['Transacciones',ts.length],['Ticket prom.',ts.length?fmt(Math.round(tt/ts.length)):'-']].map(([l,v])=>(
                  <div key={l} style={{background:'#f5ede0',borderRadius:7,padding:'5px 10px'}}>
                    <div style={{fontSize:'.6rem',color:'#8B5E3C',fontWeight:600,textTransform:'uppercase'}}>{l}</div>
                    <div style={{fontFamily:"'Fraunces',serif",fontSize:'1rem',fontWeight:700,color:'#3d2010'}}>{v}</div>
                  </div>
                ))}
              </div>
            );})()}

            {/* Alerta stock crítico */}
            {stockCriticos.filter(p=>p.stock===0).length>0&&(
              <div style={{padding:'5px 12px',background:'#fde8e8',borderBottom:'1px solid #f5b7b1',display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
                <span style={{fontSize:'.72rem',fontWeight:700,color:'#c0392b'}}>⚠️ SIN STOCK:</span>
                {stockCriticos.filter(p=>p.stock===0).slice(0,6).map(p=>(
                  <span key={p.id} style={{fontSize:'.68rem',background:'#fff',border:'1px solid #f5b7b1',borderRadius:10,padding:'2px 8px',color:'#c0392b'}}>{p.name}</span>
                ))}
              </div>
            )}

            <div style={{display:'flex',gap:6,padding:'7px 12px',overflowX:'auto',background:'#fff9f2',borderBottom:'1px solid #e8d5b7'}}>
              {cats.map(c=><button key={c} style={S.catBtn(catFilter===c)} onClick={()=>setCatFilter(c)}>{c}</button>)}
            </div>

            <div style={{flex:1,overflowY:'auto',padding:'10px 12px',display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(128px,1fr))',gap:8,alignContent:'start'}}>
              {filtered.length===0&&<div style={{gridColumn:'1/-1',textAlign:'center',padding:36,color:'#c9b99a'}}>Sin resultados</div>}
              {filtered.map(p=>{const inCart=cart.find(x=>x.id===p.id);const sinStock=p.stock===0;return(
                <button key={p.id} onClick={()=>addToCart(p)}
                  style={{background:inCart?'#3d2010':sinStock?'#fde8e8':'#fff9f2',border:'1.5px solid '+(inCart?'#3d2010':sinStock?'#f5b7b1':'#e8d5b7'),borderRadius:10,padding:'10px 8px',cursor:sinStock?'not-allowed':'pointer',textAlign:'left',opacity:sinStock?0.7:1}}>
                  <div style={{fontSize:'.82rem',fontWeight:600,color:inCart?'#f5ede0':'#3d2010',marginBottom:3,lineHeight:1.2}}>{p.name}</div>
                  <div style={{fontFamily:"'Fraunces',serif",fontSize:'1rem',fontWeight:700,color:inCart?'#c9963a':'#8B5E3C'}}>{fmt(p.price)}</div>
                  <div style={{fontSize:'.65rem',marginTop:2,color:p.stock===0?'#c0392b':p.stock<=3?'#c9963a':'#a8a29e'}}>{p.stock===0?'Sin stock':p.stock<=3?'⚠️ Quedan: '+p.stock:'Stock: '+p.stock}</div>
                </button>
              );})}
            </div>
          </div>

          {/* ── Carrito ── */}
          <div style={{background:'#fff9f2',borderLeft:'2px solid #e8d5b7',display:'flex',flexDirection:'column'}}>
            <div style={{padding:'11px 14px',borderBottom:'1.5px solid #e8d5b7',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <span style={{fontFamily:"'Fraunces',serif",fontWeight:700,color:'#3d2010'}}>Pedido</span>
              <div style={{display:'flex',gap:6}}>
                {cart.length>0&&<button onClick={()=>setCart([])} style={{...S.btn('#fde8e8','#c0392b'),padding:'4px 10px',fontSize:'.75rem'}}>Vaciar</button>}

                  </div>
                  {groups[cat].map(p=>(
                    <div key={p.id} style={{display:'flex',alignItems:'center',padding:'9px 12px',borderBottom:'1px solid #f5ede0',gap:8,background:p.stock===0?'#fff5f5':'#fff9f2',flexWrap:'wrap'}}>

                creditosPendientes:pendCredits.length,totalCredPendiente:pendCredits.reduce((a,c)=>a+c.total,0),
                stockCritico:products.filter(p=>p.stock<=3).map(p=>({id:p.id,name:p.name,stock:p.stock}))};
              exportarCierre(cierre);
              showToast('✅ Reporte descargado');
            }} style={{...S.btn('#8B5E3C'),padding:'7px 14px',fontSize:'.82rem',marginLeft:'auto'}}>⬇️ Exportar PDF</button>

                    <div style={{fontFamily:"'Fraunces',serif",fontWeight:700,fontSize:'1rem',color:'#3d2010'}}>${Math.round(v).toLocaleString('es-CL')}</div>

                  </div>
                </div>

                      <span style={{fontSize:'.7rem',fontWeight:700,color:i===0?'#2d6a4f':i===1?'#c9963a':'#a8a29e',minWidth:16}}>{i+1}</span>

                  </div>

                      <div style={{fontWeight:700,fontSize:'.95rem',color:'#3d2010'}}>{cName}</div>

                    </div>
                    <div style={{textAlign:'right'}}>
                      {hasPending&&<div style={{fontFamily:"'Fraunces',serif",fontSize:'1.2rem',fontWeight:700,color:'#c0392b'}}>{fmt(data.pending)}</div>}
                      {data.paid>0&&<div style={{fontSize:'.72rem',color:'#2d6a4f',fontWeight:600}}>✅ {fmt(data.paid)}</div>}
                    </div>
                  </div>
                  <div style={{borderTop:'1px solid #f5ede0',maxHeight:180,overflowY:'auto'}}>
                    {[...data.entries].sort((a,b)=>b.date>a.date?1:-1).map(cr=>(
                      <div key={cr.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'7px 16px',borderBottom:'1px solid #f5ede0',gap:8,background:cr.paid?'#f9fff9':'#fff9f2'}}>

                        </div>
                        <div style={{display:'flex',gap:6,alignItems:'center'}}>
                          <span style={{fontWeight:700,fontSize:'.88rem',color:cr.paid?'#2d6a4f':'#c0392b'}}>{fmt(cr.total)}</span>

                      <button onClick={async()=>{if(!window.confirm('¿Cobrar todo el saldo de '+cName+'?'))return;for(const cr of data.entries.filter(x=>!x.paid))await pagarCredito(cr.id);showToast('✅ Saldo cobrado');}} style={{...S.btn('#2d6a4f'),fontSize:'.8rem',padding:'7px 14px'}}>✓ Cobrar todo ({fmt(data.pending)})</button>

                  </div>
                </div>
              );
            });
          })()}

            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
              <div style={{fontWeight:700,color:'#3d2010'}}>🔒 Historial de Cierres</div>
              <span style={{fontSize:'.75rem',color:'#8B5E3C'}}>{cierres.length} cierres guardados</span>
            </div>
            {cierres.length===0?(
              <div style={{fontSize:'.82rem',color:'#a8a29e'}}>Aún no has realizado ningún cierre. Usa el botón "🔒 Cierre" en la Caja.</div>
            ):(
              <div style={{maxHeight:280,overflowY:'auto'}}>
                {cierres.map((c,i)=>(
                  <div key={c.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid #f5ede0',gap:8}}>
                    <div>
                      <div style={{fontWeight:600,fontSize:'.85rem',color:'#3d2010'}}>{c.fecha} · {c.hora}</div>
                      <div style={{fontSize:'.72rem',color:'#8B5E3C'}}>{c.ventas} transacciones · {fmt(c.total)}</div>
                    </div>
                    <button onClick={()=>exportarCierre(c)} style={{...S.btn('#c9963a'),padding:'5px 12px',fontSize:'.75rem'}}>⬇️ PDF</button>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* Stock crítico */}
          {stockCriticos.length>0&&(
            <div style={{...S.card,padding:18,marginBottom:14,border:'2px solid #c0392b'}}>
              <div style={{fontWeight:700,color:'#c0392b',marginBottom:10}}>⚠️ Stock Crítico ({stockCriticos.length} productos)</div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))',gap:6}}>
                {stockCriticos.map(p=>(
                  <div key={p.id} style={{background:p.stock===0?'#fde8e8':'#fef3c7',borderRadius:8,padding:'6px 10px'}}>
                    <div style={{fontSize:'.78rem',fontWeight:600,color:'#3d2010'}}>{p.name}</div>
                    <div style={{fontSize:'.72rem',color:p.stock===0?'#c0392b':'#c9963a',fontWeight:700}}>{p.stock===0?'SIN STOCK':p.stock+' unidades'}</div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Migración */}
          <div style={{...S.card,padding:18,border:'2px solid #e8d5b7'}}>
            <div style={{fontWeight:700,color:'#3d2010',marginBottom:4}}>🚀 Migrar datos</div>
            <div style={{fontSize:'.8rem',color:'#8B5E3C',marginBottom:10}}>Carga 343 productos, 355 ventas y 15 créditos a Google Sheets. Solo una vez.</div>
            <button onClick={runMigration} style={{...S.btn('#c9963a'),padding:'10px 18px',fontSize:'.9rem'}}>🚀 Migrar ahora</button>
          </div>
        </div>
      )}

      {/* ── Modal: Editar Producto ── */}
      {editP&&(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.55)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:16}} onClick={e=>{if(e.target===e.currentTarget)setEditP(null);}}>
          <div style={{...S.card,padding:22,maxWidth:360,width:'100%',maxHeight:'92vh',overflowY:'auto'}}>
            <div style={{fontFamily:"'Fraunces',serif",fontWeight:700,fontSize:'1.1rem',color:'#3d2010',marginBottom:16}}>{editP._new?'➕ Nuevo':'✏️ Editar'}{!editP._new&&<div style={{fontSize:'.72rem',color:'#a8a29e'}}>ID: {editP.id}</div>}</div>
            {[['Nombre *','name','text'],['Código/ID','id','text'],['Precio ($) *','price','number'],['Costo ($)','cost','number'],['Stock','stock','number']].map(([l,k,t],idx)=>(
              <div key={k} style={{marginBottom:11}}>
                <div style={{fontSize:'.75rem',color:'#8B5E3C',fontWeight:600,marginBottom:4}}>{l}</div>
                <input autoFocus={idx===0} type={t} value={editP[k]??''} onChange={e=>setEditP(p=>({...p,[k]:t==='number'?parseInt(e.target.value)||0:e.target.value}))}
                  style={{width:'100%',padding:'9px 12px',border:'2px solid '+(k==='name'||k==='price'?'#c9963a':'#e8d5b7'),borderRadius:8,fontSize:'.92rem',background:k==='id'?'#fef3c7':'#fff9f2',textAlign:t==='number'?'right':'left'}}/>
              </div>
            ))}
            <div style={{marginBottom:16}}>
              <div style={{fontSize:'.75rem',color:'#8B5E3C',fontWeight:600,marginBottom:4}}>Categoría</div>
              <select value={editP.category||'Panadería'} onChange={e=>setEditP(p=>({...p,category:e.target.value}))} style={{width:'100%',padding:'9px 12px',border:'2px solid #e8d5b7',borderRadius:8,fontSize:'.92rem',background:'#fff9f2'}}>
                {['Panadería','Bollería','Pastelería','Café','Café de Máquina','Nevera','Bebidas','Charcutería','Abarrotes','Congelado','Otro'].map(c=><option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div style={{display:'flex',gap:8}}>
              <button onClick={()=>saveProduct(editP)} disabled={processing} style={{...S.btn(processing?'#a8a29e':'#2d6a4f'),flex:2,padding:'11px',opacity:processing?0.6:1}}>{processing?'⏳ Guardando...':editP._new?'➕ Agregar':'💾 Guardar'}</button>
              {!editP._new&&<button onClick={()=>deleteProduct(editP)} disabled={processing} style={{...S.btn('#fde8e8','#c0392b'),padding:'11px 14px',opacity:processing?0.4:1}}>🗑️</button>}
              <button onClick={()=>setEditP(null)} style={{...S.btn('#f5ede0','#8B5E3C'),flex:1}}>Cancelar</button>
            </div>
          </div>
        </div>
      )}

      {/* ── Modal: Cargar Stock ── */}
      {stockModal&&(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.55)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:16}}>
          <div style={{...S.card,padding:24,maxWidth:300,width:'100%'}}>
            <div style={{fontFamily:"'Fraunces',serif",fontWeight:700,fontSize:'1.05rem',color:'#3d2010',marginBottom:8}}>📦 Cargar Stock — {stockModal.product.name}</div>
            <div style={{fontSize:'.78rem',color:'#a8a29e',marginBottom:12}}>Stock actual: <strong style={{color:stockModal.product.stock===0?'#c0392b':'#2d6a4f'}}>{stockModal.product.stock}</strong></div>
            <input type="number" autoFocus value={stockModal.qty} onChange={e=>setStockModal(m=>({...m,qty:parseInt(e.target.value)||0}))}
              style={{width:'100%',padding:'10px',border:'2px solid #c9963a',borderRadius:8,fontSize:'1.2rem',fontWeight:700,textAlign:'center',marginBottom:12,background:'#fef3c7'}}/>
            <div style={{display:'flex',gap:8}}>
              <button onClick={async()=>{
                if(stockModal.qty<=0){showToast('⚠️ Ingresa una cantidad','#c9963a');return;}
                const ns=stockModal.product.stock+stockModal.qty;
                const r=await api(null,{action:'updateStock',id:stockModal.product.id,stock:ns});
                if(r.error){showToast('⚠️ Error al actualizar','#c0392b');return;}
                storage.addMovimiento({fecha:localDate(),hora:localTime(),tipo:'carga',producto:stockModal.product.name,cantidad:+stockModal.qty,stockAntes:stockModal.product.stock,stockDespues:ns,ref:'carga manual'});
                setProducts(ps=>ps.map(p=>p.id===stockModal.product.id?{...p,stock:ns}:p));
                showToast('✅ +'+stockModal.qty+' unidades a '+stockModal.product.name);
                setStockModal(null);
              }} style={{...S.btn('#2d6a4f'),flex:1,padding:'11px'}}>✓ Agregar</button>
              <button onClick={()=>setStockModal(null)} style={{...S.btn('#f5ede0','#8B5E3C'),flex:1}}>Cancelar</button>
            </div>
          </div>
        </div>
      )}

      {/* ── Modal: Cargo Crédito ── */}
      {creditModal&&creditModal._new!==undefined&&(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.55)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:16}}>
          <div style={{...S.card,padding:20,maxWidth:360,width:'100%'}}>
            <div style={{fontFamily:"'Fraunces',serif",fontWeight:700,color:'#3d2010',marginBottom:14}}>{creditModal.client?'Cargo para '+creditModal.client:'Nuevo Cargo'}</div>
            <div style={{marginBottom:10}}>
              <div style={{fontSize:'.75rem',color:'#8B5E3C',fontWeight:600,marginBottom:3}}>Cliente *</div>
              <input autoFocus value={creditModal.client} onChange={e=>setCreditModal(m=>({...m,client:e.target.value}))} placeholder="Nombre..." style={{width:'100%',padding:'9px 12px',border:'2px solid #e8d5b7',borderRadius:8,fontSize:'.9rem',background:'#f5ede0'}}/>
            </div>
            <div style={{marginBottom:10}}>
              <div style={{fontSize:'.75rem',color:'#8B5E3C',fontWeight:600,marginBottom:3}}>Monto ($) *</div>
              <input type="number" value={creditModal.monto||''} onChange={e=>setCreditModal(m=>({...m,monto:parseInt(e.target.value)||0}))} style={{width:'100%',padding:'9px 12px',border:'2px solid #c9963a',borderRadius:8,fontSize:'1.1rem',fontWeight:700,background:'#fef3c7',textAlign:'right'}}/>
            </div>
            <div style={{marginBottom:14}}>
              <div style={{fontSize:'.75rem',color:'#8B5E3C',fontWeight:600,marginBottom:3}}>Detalle</div>
              <input value={creditModal.nota||''} onChange={e=>setCreditModal(m=>({...m,nota:e.target.value}))} placeholder="Ej: pan, café..." style={{width:'100%',padding:'8px 12px',border:'1.5px solid #e8d5b7',borderRadius:8,fontSize:'.88rem',background:'#f5ede0'}}/>
            </div>
            <div style={{display:'flex',gap:8}}>
              <button onClick={async()=>{
                if(!creditModal.client.trim()){showToast('⚠️ Ingresa el nombre','#c9963a');return;}
                if(!creditModal.monto||creditModal.monto<=0){showToast('⚠️ Ingresa un monto','#c9963a');return;}
                const cr={id:Date.now().toString(),date:localDate(),time:localTime(),client:creditModal.client.trim(),total:creditModal.monto,nota:creditModal.nota||'',items:[],paid:false};
                const r=await api(null,{action:'saveCredit',credit:cr});
                if(r.error){showToast('⚠️ Error al guardar','#c0392b');return;}
                setCredits(cs=>[cr,...cs]);
                showToast('✅ Cargo de '+fmt(creditModal.monto));
                setCreditModal(null);
              }} style={{...S.btn('#c0392b'),flex:1,padding:'11px'}}>✓ Registrar</button>
              <button onClick={()=>setCreditModal(null)} style={{...S.btn('#f5ede0','#8B5E3C'),flex:1}}>Cancelar</button>
            </div>
          </div>
        </div>
      )}

      {/* ── Modal: Cierre de Caja ── */}
      {cierreModal&&(()=>{
        const todaySales=sales.filter(s=>getSaleDate(s)===localDate());
        const tt=todaySales.reduce((a,s)=>a+s.total,0);
        const bm={'Efectivo':0,'Getnet':0,'Transferencia':0,'Crédito':0};
        todaySales.forEach(s=>{const nm=normMethod(s.method||s.payment);if(bm[nm]!==undefined)bm[nm]+=s.total;});
        const stockCrit=products.filter(p=>p.stock<=3);
        return (
          <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.65)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:16}} onClick={e=>{if(e.target===e.currentTarget)setCierreModal(false);}}>
            <div style={{...S.card,padding:24,maxWidth:400,width:'100%',maxHeight:'90vh',overflowY:'auto'}}>
              <div style={{fontFamily:"'Fraunces',serif",fontWeight:700,fontSize:'1.15rem',color:'#3d2010',marginBottom:4}}>🔒 Cierre de Caja</div>
              <div style={{fontSize:'.78rem',color:'#8B5E3C',marginBottom:16}}>{localDate()} · {localTime()}</div>

              <div style={{background:'#f0fdf4',borderRadius:10,padding:'12px 16px',marginBottom:12}}>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                  <span style={{fontSize:'.82rem',color:'#8B5E3C'}}>Transacciones</span><span style={{fontWeight:700}}>{todaySales.length}</span>
                </div>
                <div style={{display:'flex',justifyContent:'space-between'}}>
                  <span style={{fontSize:'.9rem',fontWeight:700,color:'#2d6a4f'}}>TOTAL DEL DÍA</span>
                  <span style={{fontFamily:"'Fraunces',serif",fontSize:'1.3rem',fontWeight:900,color:'#2d6a4f'}}>{fmt(tt)}</span>
                </div>
              </div>

              {Object.entries(bm).filter(([,v])=>v>0).map(([m,v])=>(
                <div key={m} style={{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid #f5ede0',fontSize:'.85rem'}}>
                  <span>{m==='Efectivo'?'💵':m==='Getnet'?'💳':m==='Transferencia'?'📲':'📝'} {m}</span>
                  <span style={{fontWeight:700}}>{fmt(v)}</span>
                </div>
              ))}

              {pendCredits.length>0&&(
                <div style={{marginTop:10,padding:'8px 12px',background:'#fde8e8',borderRadius:8,fontSize:'.82rem'}}>
                  <span style={{color:'#c0392b',fontWeight:700}}>📝 Créditos pendientes: </span>
                  <span>{pendCredits.length} cargos · {fmt(pendCredits.reduce((a,c)=>a+c.total,0))}</span>
                </div>
              )}

              {stockCrit.length>0&&(
                <div style={{marginTop:8,padding:'8px 12px',background:'#fef3c7',borderRadius:8,fontSize:'.78rem'}}>
                  <span style={{color:'#c9963a',fontWeight:700}}>⚠️ Stock crítico: </span>
                  <span>{stockCrit.filter(p=>p.stock===0).length} sin stock · {stockCrit.filter(p=>p.stock>0).length} bajos</span>
                </div>
              )}

              <div style={{marginTop:16,display:'flex',gap:8}}>
                <button onClick={realizarCierre} style={{...S.btn('#3d2010'),flex:2,padding:'12px',fontSize:'.9rem'}}>🔒 Realizar Cierre y Descargar PDF</button>
                <button onClick={()=>setCierreModal(false)} style={{...S.btn('#f5ede0','#8B5E3C'),flex:1}}>Cancelar</button>
              </div>
              <div style={{marginTop:8,fontSize:'.7rem',color:'#a8a29e',textAlign:'center'}}>Se descargará un archivo HTML que puedes abrir e imprimir como PDF</div>
            </div>
          </div>
        );
      })()}

    </div>
  );
}

setInterval(()=>{const el=document.getElementById('clk');if(el)el.textContent=new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});const dEl=document.getElementById('hdr-date');if(dEl)dEl.textContent=new Date().toLocaleDateString('es-CL',{timeZone:'America/Santiago',year:'numeric',month:'2-digit',day:'2-digit'}).split('/').reverse().join('-');},1000);
ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body>
</html>
